name: Equsto site CI

on:
  push:
    branches: [main, master]
    paths:
      - "EQUSTO-WORK/E-TICARET/site/**"
      - ".github/workflows/equsto-v2-ci.yml"
  pull_request:
    paths:
      - "EQUSTO-WORK/E-TICARET/site/**"

defaults:
  run:
    working-directory: EQUSTO-WORK/E-TICARET/site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: EQUSTO-WORK/E-TICARET/site/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/postgres"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/postgres"
