name: Hetzner deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "E-TICARET/site/**"
      - ".github/workflows/hetzner-deploy.yml"

concurrency:
  group: hetzner-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      TEPEPLATFORM_ENABLED: ${{ secrets.TEPEPLATFORM_ENABLED }}
      TEPEPLATFORM_BASE_URL: ${{ secrets.TEPEPLATFORM_BASE_URL }}
      TEPEPLATFORM_API_KEY: ${{ secrets.TEPEPLATFORM_API_KEY }}
      TEPEPLATFORM_API_SECRET: ${{ secrets.TEPEPLATFORM_API_SECRET }}
      TEPEPLATFORM_PARTNER_SLUG: ${{ secrets.TEPEPLATFORM_PARTNER_SLUG }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.HETZNER_HOST != '' && env.HETZNER_HOST || '167.233.86.144' }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_SSH_PASSPHRASE }}
          command_timeout: 30m
          envs: TEPEPLATFORM_ENABLED,TEPEPLATFORM_BASE_URL,TEPEPLATFORM_API_KEY,TEPEPLATFORM_API_SECRET,TEPEPLATFORM_PARTNER_SLUG
          script: |
            set -euo pipefail
            cd /opt/equsto/E-TICARET/site
            ENVF=.env.production
            upsert() {
              local k="$1" v="$2"
              [ -n "$v" ] || return 0
              if grep -q "^${k}=" "$ENVF" 2>/dev/null; then
                sed -i "s|^${k}=.*|${k}=${v}|" "$ENVF"
              else
                printf '%s=%s\n' "$k" "$v" >> "$ENVF"
              fi
            }
            if [ -n "${TEPEPLATFORM_API_KEY:-}" ] && [ -n "${TEPEPLATFORM_API_SECRET:-}" ]; then
              upsert TEPEPLATFORM_ENABLED "${TEPEPLATFORM_ENABLED:-true}"
              upsert TEPEPLATFORM_BASE_URL "${TEPEPLATFORM_BASE_URL:-https://tepeplatform.com}"
              upsert TEPEPLATFORM_API_KEY "$TEPEPLATFORM_API_KEY"
              upsert TEPEPLATFORM_API_SECRET "$TEPEPLATFORM_API_SECRET"
              upsert TEPEPLATFORM_PARTNER_SLUG "${TEPEPLATFORM_PARTNER_SLUG:-equsto-endustriyel-mutfak}"
              echo "[deploy] TepePlatform env güncellendi"
            else
              echo "[deploy] TepePlatform secrets yok — kart ödemesi kapalı kalır"
            fi
            bash scripts/hetzner-deploy.sh

      - name: Özet
        if: success()
        run: |
          {
            echo "## Canlı deploy tamam"
            echo ""
            echo "- **Site:** https://equsto.com/"
            echo "- **Sunucu:** \`${{ env.HETZNER_HOST != '' && env.HETZNER_HOST || '167.233.86.144' }}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Tetikleyici:** ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
