name: Hetzner deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "E-TICARET/site/**"
      - ".github/workflows/hetzner-deploy.yml"

concurrency:
  group: hetzner-deploy
  cancel-in-progress: false
  # redeploy: GitHub TELEGRAM_CHAT_ID updated

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID != '' && secrets.GOOGLE_CLIENT_ID || '1041839711854-kj81vgdnu9qp8jv5t58hlcamd4q587r3.apps.googleusercontent.com' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL != '' ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} secrets.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
      GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.HETZNER_HOST != '' && env.HETZNER_HOST || '167.233.86.144' }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_SSH_PASSPHRASE }}
          command_timeout: 30m
          envs: GITHUB_TOKEN, CLOUDFRONT_DISTRIBUTION_ID, GOOGLE_CLIENT_SECRET, GOOGLE_CLIENT_ID, ANTHROPIC_API_KEY, ANTHROPIC_MODEL, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, GREEN_API_INSTANCE_ID, GREEN_API_TOKEN, RESEND_API_KEY
          script: |
            set -euo pipefail
            # --- notify diagnose (masked last4 only; no tokens) ---
            node <<'DIAG'
            const fs = require("fs");
            function readMap(file) {
              const out = {};
              if (!fs.existsSync(file)) return out;
              for (const line of fs.readFileSync(file, "utf8").split(/\n/)) {
                if (!line || line.trim().startsWith("#") || !line.includes("=")) continue;
                const i = line.indexOf("=");
                const k = line.slice(0, i).trim();
                let v = line.slice(i + 1).trim();
                if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) v = v.slice(1, -1);
                out[k] = v;
              }
              return out;
            }
            const digits = (raw) => String(raw || "").replace(/\D/g, "");
            const maskPhone = (raw) => {
              const d = digits(raw);
              return d ? "***" + d.slice(-4) + "(len=" + d.length + ")" : "EMPTY";
            };
            const normalize = (raw) => {
              let d = digits(raw);
              if (d.startsWith("0") && d.length === 11) d = "90" + d.slice(1);
              if (d.length === 10 && d.startsWith("5")) d = "90" + d;
              return d;
            };
            const keep = readMap("/opt/equsto/.env.production.keep");
            const site = readMap("/opt/equsto/E-TICARET/site/.env.production");
            const src = { ...site, ...keep };
            const mode = String(src.EQUSTO_WHATSAPP_MODE || "").trim() || "(empty)";
            const wid = normalize(src.GREEN_API_INSTANCE_WID || src.GREEN_API_INSTANCE_PHONE || "");
            const notify = normalize(src.WHATSAPP_NOTIFY_TO || src.EQUSTO_NOTIFY_SMS_E164 || src.EQUSTO_WHATSAPP_E164 || "");
            const alt = normalize(src.WHATSAPP_NOTIFY_ALT_TO || "");
            const greenOk = Boolean(String(src.GREEN_API_INSTANCE_ID || "").trim() && String(src.GREEN_API_TOKEN || "").trim());
            const effectiveMode = /^(meta|cloud|facebook)$/i.test(mode) ? "meta" : /^(green-api|greenapi|green)$/i.test(mode) ? "green-api" : greenOk ? "green-api(auto)" : "link";
            const selfBlocked = String(effectiveMode).startsWith("green-api") && wid && notify && wid === notify;
            const ownerTargets = [];
            if (selfBlocked) { if (alt && alt !== notify) ownerTargets.push(alt); }
            else { if (notify) ownerTargets.push(notify); if (alt && alt !== notify) ownerTargets.push(alt); }
            console.log("DIAG_MODE_RAW=" + mode);
            console.log("DIAG_MODE_EFFECTIVE=" + effectiveMode);
            console.log("DIAG_GREEN_API_KEYS=" + (greenOk ? "ok" : "MISSING"));
            console.log("DIAG_INSTANCE_WID=" + maskPhone(src.GREEN_API_INSTANCE_WID));
            console.log("DIAG_NOTIFY_TO=" + maskPhone(src.WHATSAPP_NOTIFY_TO));
            console.log("DIAG_NOTIFY_ALT=" + maskPhone(src.WHATSAPP_NOTIFY_ALT_TO));
            console.log("DIAG_E164=" + maskPhone(src.EQUSTO_WHATSAPP_E164));
            console.log("DIAG_RESOLVED_INSTANCE=" + (wid ? maskPhone(wid) : "EMPTY"));
            console.log("DIAG_RESOLVED_NOTIFY=" + (notify ? maskPhone(notify) : "EMPTY"));
            console.log("DIAG_SELF_BLOCK=" + (selfBlocked ? "YES" : "no"));
            console.log("DIAG_OWNER_WA_TARGETS=" + (ownerTargets.length ? ownerTargets.map((t) => maskPhone(t)).join(",") : "NONE"));
            console.log("DIAG_TELEGRAM=" + (String(src.TELEGRAM_BOT_TOKEN || "").trim() && String(src.TELEGRAM_CHAT_ID || "").trim() ? "ok" : "MISSING"));
            DIAG
            # --- end notify diagnose ---
            cd /opt/equsto/E-TICARET/site
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/equsto-dev/equsto.git"
            # git reset .env.production şablonunu ezer; anahtar keep'te kalmalı.
            # GitHub secret varsa keep'e yaz — protect-hetzner-env keep'ten geri yükler.
            node <<'NODE'
            const fs = require("fs");
            const path = require("path");
            function envVal(name) {
              return String(process.env[name] || "").trim();
            }
            function hasKey(file, name, minLen) {
              try {
                const t = fs.readFileSync(file, "utf8");
                return t.split(/\n/).some((line) => {
                  if (!line.startsWith(name + "=")) return false;
                  const v = line.slice(name.length + 1).trim().replace(/^['"]|['"]$/g, "");
                  return v.length >= minLen;
                });
              } catch {
                return false;
              }
            }
            function mergeKey(file, name, value) {
              fs.mkdirSync(path.dirname(file), { recursive: true });
              const t = fs.existsSync(file) ? fs.readFileSync(file, "utf8") : "";
              const lines = t.split(/\n/);
              let found = false;
              const out = lines.map((line) => {
                if (!line.startsWith(name + "=")) return line;
                found = true;
                return name + "=" + value;
              });
              if (!found) {
                if (out.length && out[out.length - 1] !== "") out.push("");
                out.push(name + "=" + value);
              }
              fs.writeFileSync(file, out.join("\n").replace(/\n+$/, "\n"));
            }
            function inject(name, minLen) {
              const keep = "/opt/equsto/.env.production.keep";
              const site = ".env.production";
              const secret = envVal(name);
              const ok = secret.length >= minLen;
              console.log("KEEP_" + name + "=" + (hasKey(keep, name, minLen) ? "ok" : "MISSING"));
              console.log("SITE_" + name + "=" + (hasKey(site, name, minLen) ? "ok" : "MISSING"));
              console.log("GH_SECRET_" + name + "=" + (ok ? "ok" : "MISSING"));
              if (ok) {
                mergeKey(keep, name, secret);
                mergeKey(site, name, secret);
                console.log("INJECT_" + name + "=wrote keep+site len=" + secret.length);
              } else {
                console.log("INJECT_" + name + "=skipped");
              }
            }
            inject("ANTHROPIC_API_KEY", 20);
            inject("ANTHROPIC_MODEL", 3);
            inject("TELEGRAM_BOT_TOKEN", 20);
            {
              const t = envVal("TELEGRAM_BOT_TOKEN");
              const shape = /^\d{5,}:[A-Za-z0-9_-]{20,}$/.test(t)
                ? "botId:secret"
                : t.length
                  ? "invalid"
                  : "empty";
              console.log("GH_SECRET_TELEGRAM_BOT_TOKEN_SHAPE=" + shape);
            }
            inject("TELEGRAM_CHAT_ID", 3);
            inject("RESEND_API_KEY", 10);
            inject("GREEN_API_INSTANCE_ID", 3);
            inject("GREEN_API_TOKEN", 10);

            // Boş notify telefonlarını Equsto varsayılanlarıyla doldur (token değil).
            // 532 = bildirim / vitrin, 554 = Green API QR iş hattı (.env.notify.secrets.example).
            {
              const keep = "/opt/equsto/.env.production.keep";
              const site = ".env.production";
              const defaults = {
                EQUSTO_WHATSAPP_E164: "905326840152",
                WHATSAPP_NOTIFY_TO: "905326840152",
                GREEN_API_INSTANCE_WID: "905542378532",
              };
              for (const [name, value] of Object.entries(defaults)) {
                if (!hasKey(keep, name, 10) && !hasKey(site, name, 10)) {
                  mergeKey(keep, name, value);
                  mergeKey(site, name, value);
                  console.log("FILL_" + name + "=***" + value.slice(-4));
                } else {
                  console.log("FILL_" + name + "=keep");
                }
              }
              if (!hasKey(keep, "EQUSTO_WHATSAPP_MODE", 4) && hasKey(keep, "GREEN_API_INSTANCE_ID", 3)) {
                mergeKey(keep, "EQUSTO_WHATSAPP_MODE", "green-api");
                mergeKey(site, "EQUSTO_WHATSAPP_MODE", "green-api");
                console.log("FILL_EQUSTO_WHATSAPP_MODE=green-api");
              }
            }
            NODE
            docker compose --env-file .env.production exec -T app node -e 'const v=process.env["ANTHROPIC_API_KEY"]; const t=process.env["TELEGRAM_BOT_TOKEN"]; const c=process.env["TELEGRAM_CHAT_ID"]; console.log("CONTAINER_ANTHROPIC="+(v&&String(v).trim()?"ok":"MISSING")); console.log("CONTAINER_TELEGRAM="+(t&&c&&String(t).trim()&&String(c).trim()?"ok":"MISSING"));' || echo CONTAINER_SECRETS=unreachable

            git fetch origin
            git reset --hard origin/main
            bash scripts/hetzner-deploy.sh
            docker compose --env-file .env.production exec -T app node -e 'const t=process.env["TELEGRAM_BOT_TOKEN"]; const c=process.env["TELEGRAM_CHAT_ID"]; console.log("CONTAINER_TELEGRAM="+(t&&c&&String(t).trim()&&String(c).trim()?"ok":"MISSING"));' || echo CONTAINER_TELEGRAM=unreachable
            # post-deploy diagnose (after protect fill)
            node <<'DIAG2'
            const fs = require("fs");
            function readMap(file) {
              const out = {};
              if (!fs.existsSync(file)) return out;
              for (const line of fs.readFileSync(file, "utf8").split(/\n/)) {
                if (!line || line.trim().startsWith("#") || !line.includes("=")) continue;
                const i = line.indexOf("=");
                const k = line.slice(0, i).trim();
                let v = line.slice(i + 1).trim();
                if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) v = v.slice(1, -1);
                out[k] = v;
              }
              return out;
            }
            const digits = (raw) => String(raw || "").replace(/\D/g, "");
            const maskPhone = (raw) => {
              const d = digits(raw);
              return d ? "***" + d.slice(-4) + "(len=" + d.length + ")" : "EMPTY";
            };
            const normalize = (raw) => {
              let d = digits(raw);
              if (d.startsWith("0") && d.length === 11) d = "90" + d.slice(1);
              if (d.length === 10 && d.startsWith("5")) d = "90" + d;
              return d;
            };
            const keep = readMap("/opt/equsto/.env.production.keep");
            const site = readMap("/opt/equsto/E-TICARET/site/.env.production");
            const src = { ...site, ...keep };
            const wid = normalize(src.GREEN_API_INSTANCE_WID || "");
            const notify = normalize(src.WHATSAPP_NOTIFY_TO || src.EQUSTO_WHATSAPP_E164 || "");
            const alt = normalize(src.WHATSAPP_NOTIFY_ALT_TO || "");
            const selfBlocked = wid && notify && wid === notify;
            const targets = [];
            if (selfBlocked) { if (alt && alt !== notify) targets.push(alt); }
            else { if (notify) targets.push(notify); if (alt && alt !== notify) targets.push(alt); }
            console.log("POST_DIAG_WID=" + maskPhone(src.GREEN_API_INSTANCE_WID));
            console.log("POST_DIAG_NOTIFY=" + maskPhone(src.WHATSAPP_NOTIFY_TO));
            console.log("POST_DIAG_E164=" + maskPhone(src.EQUSTO_WHATSAPP_E164));
            console.log("POST_DIAG_MODE=" + (String(src.EQUSTO_WHATSAPP_MODE || "").trim() || "(empty)"));
            console.log("POST_DIAG_SELF_BLOCK=" + (selfBlocked ? "YES" : "no"));
            console.log("POST_DIAG_OWNER_WA_TARGETS=" + (targets.length ? targets.map((t) => maskPhone(t)).join(",") : "NONE"));
            DIAG2

      - name: Özet
        if: success()
        run: |
          {
            echo "## Canlı deploy tamam"
            echo ""
            echo "- **Site:** https://equsto.com/"
            echo "- **Sunucu:** \`${{ env.HETZNER_HOST != '' && env.HETZNER_HOST || '167.233.86.144' }}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Tetikleyici:** ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
