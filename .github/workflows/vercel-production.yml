# İsteğe bağlı: GitHub Actions üzerinden Vercel Production deploy
#
# main push'ta otomatik deploy genelde Vercel → Project → Git entegrasyonu ile yapılır.
# Bu workflow yalnızca aşağıdaki secret'lar tanımlıysa çalışır (yoksa skip → kırmızı X olmaz):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#
# Token: https://vercel.com/account/tokens
# ORG/PROJECT ID: `cd equsto-v2 && npx vercel link` sonrası .vercel/project.json

name: Vercel Production

on:
  push:
    branches: [main]
    paths:
      - "equsto-v2/**"
      - ".github/workflows/vercel-production.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: equsto-v2

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      ${{ secrets.VERCEL_TOKEN != '' &&
          secrets.VERCEL_ORG_ID != '' &&
          secrets.VERCEL_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: equsto-v2/package-lock.json
      - name: Pull Vercel env
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy prebuilt
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  secrets-hint:
    runs-on: ubuntu-latest
    if: >-
      ${{ secrets.VERCEL_TOKEN == '' ||
          secrets.VERCEL_ORG_ID == '' ||
          secrets.VERCEL_PROJECT_ID == '' }}
    steps:
      - name: Vercel GHA deploy atlandı
        run: |
          echo "VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID tanımlı değil."
          echo "Canlı deploy: Vercel panel → Git → main branch (Root Directory: equsto-v2)."
          echo "GHA ile deploy için: GitHub repo → Settings → Secrets and variables → Actions"
