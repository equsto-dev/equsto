name: E-TICARET site CI

on:
  push:
    branches: [main, master]
    paths:
      - "E-TICARET/site/**"
      - ".github/workflows/e-ticaret-site-ci.yml"
  pull_request:
    paths:
      - "E-TICARET/site/**"

defaults:
  run:
    working-directory: E-TICARET/site

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: E-TICARET/site/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run pfos:referans-sku-links:check
