# Canlı notify/WhatsApp numara eşleşmesi — yalnızca son 4 hane + ok/MISSING.
# Token / secret değerleri yazılmaz.
name: Hetzner notify diagnose

on:
  workflow_dispatch:

concurrency:
  group: hetzner-notify-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
    steps:
      - name: Masked phone keys via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.HETZNER_HOST != '' && env.HETZNER_HOST || '167.233.86.144' }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_SSH_PASSPHRASE }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            node <<'NODE'
            const fs = require("fs");

            function readMap(file) {
              const out = {};
              if (!fs.existsSync(file)) return out;
              for (const line of fs.readFileSync(file, "utf8").split(/\n/)) {
                if (!line || line.trim().startsWith("#") || !line.includes("=")) continue;
                const i = line.indexOf("=");
                const k = line.slice(0, i).trim();
                let v = line.slice(i + 1).trim();
                if (
                  (v.startsWith('"') && v.endsWith('"')) ||
                  (v.startsWith("'") && v.endsWith("'"))
                ) {
                  v = v.slice(1, -1);
                }
                out[k] = v;
              }
              return out;
            }

            function digits(raw) {
              return String(raw || "").replace(/\D/g, "");
            }

            function maskPhone(raw) {
              const d = digits(raw);
              if (!d) return "EMPTY";
              return "***" + d.slice(-4) + "(len=" + d.length + ")";
            }

            function normalize(raw) {
              let d = digits(raw);
              if (d.startsWith("0") && d.length === 11) d = "90" + d.slice(1);
              if (d.length === 10 && d.startsWith("5")) d = "90" + d;
              return d;
            }

            const keep = readMap("/opt/equsto/.env.production.keep");
            const site = readMap("/opt/equsto/E-TICARET/site/.env.production");
            const src = { ...site, ...keep };

            const mode = String(src.EQUSTO_WHATSAPP_MODE || "").trim() || "(empty)";
            const wid = normalize(
              src.GREEN_API_INSTANCE_WID || src.GREEN_API_INSTANCE_PHONE || "",
            );
            const notify = normalize(
              src.WHATSAPP_NOTIFY_TO ||
                src.EQUSTO_NOTIFY_SMS_E164 ||
                src.EQUSTO_WHATSAPP_E164 ||
                "",
            );
            const alt = normalize(src.WHATSAPP_NOTIFY_ALT_TO || "");
            const greenOk = Boolean(
              String(src.GREEN_API_INSTANCE_ID || "").trim() &&
                String(src.GREEN_API_TOKEN || "").trim(),
            );
            const effectiveMode = /^(meta|cloud|facebook)$/i.test(mode)
              ? "meta"
              : /^(green-api|greenapi|green)$/i.test(mode)
                ? "green-api"
                : greenOk
                  ? "green-api(auto)"
                  : "link";
            const selfBlocked =
              String(effectiveMode).startsWith("green-api") &&
              wid &&
              notify &&
              wid === notify;
            const ownerTargets = [];
            if (selfBlocked) {
              if (alt && alt !== notify) ownerTargets.push(alt);
            } else {
              if (notify) ownerTargets.push(notify);
              if (alt && alt !== notify) ownerTargets.push(alt);
            }

            console.log(
              "DIAG_KEEP=" +
                (fs.existsSync("/opt/equsto/.env.production.keep") ? "ok" : "MISSING"),
            );
            console.log(
              "DIAG_SITE_ENV=" +
                (fs.existsSync("/opt/equsto/E-TICARET/site/.env.production")
                  ? "ok"
                  : "MISSING"),
            );
            console.log("DIAG_MODE_RAW=" + mode);
            console.log("DIAG_MODE_EFFECTIVE=" + effectiveMode);
            console.log("DIAG_GREEN_API_KEYS=" + (greenOk ? "ok" : "MISSING"));
            console.log("DIAG_INSTANCE_WID=" + maskPhone(src.GREEN_API_INSTANCE_WID));
            console.log(
              "DIAG_INSTANCE_PHONE=" + maskPhone(src.GREEN_API_INSTANCE_PHONE),
            );
            console.log("DIAG_NOTIFY_TO=" + maskPhone(src.WHATSAPP_NOTIFY_TO));
            console.log("DIAG_NOTIFY_ALT=" + maskPhone(src.WHATSAPP_NOTIFY_ALT_TO));
            console.log("DIAG_E164=" + maskPhone(src.EQUSTO_WHATSAPP_E164));
            console.log(
              "DIAG_RESOLVED_INSTANCE=" + (wid ? maskPhone(wid) : "EMPTY"),
            );
            console.log(
              "DIAG_RESOLVED_NOTIFY=" + (notify ? maskPhone(notify) : "EMPTY"),
            );
            console.log("DIAG_SELF_BLOCK=" + (selfBlocked ? "YES" : "no"));
            console.log(
              "DIAG_OWNER_WA_TARGETS=" +
                (ownerTargets.length
                  ? ownerTargets.map((t) => maskPhone(t)).join(",")
                  : "NONE"),
            );
            console.log(
              "DIAG_TELEGRAM=" +
                (String(src.TELEGRAM_BOT_TOKEN || "").trim() &&
                String(src.TELEGRAM_CHAT_ID || "").trim()
                  ? "ok"
                  : "MISSING"),
            );
            NODE

            cd /opt/equsto/E-TICARET/site
            docker compose --env-file .env.production exec -T app node -e '
            const n=s=>String(s||"").replace(/\D/g,"");
            const mask=s=>{const d=n(s);return d?("***"+d.slice(-4)+"(len="+d.length+")"):"EMPTY"};
            const mode=String(process.env.EQUSTO_WHATSAPP_MODE||"").trim()||"(empty)";
            const wid=n(process.env.GREEN_API_INSTANCE_WID||process.env.GREEN_API_INSTANCE_PHONE||"");
            const notify=n(process.env.WHATSAPP_NOTIFY_TO||process.env.EQUSTO_NOTIFY_SMS_E164||process.env.EQUSTO_WHATSAPP_E164||"");
            const green=!!(String(process.env.GREEN_API_INSTANCE_ID||"").trim()&&String(process.env.GREEN_API_TOKEN||"").trim());
            const eff=/^(meta|cloud|facebook)$/i.test(mode)?"meta":/^(green-api|greenapi|green)$/i.test(mode)?"green-api":green?"green-api(auto)":"link";
            const blocked=String(eff).startsWith("green-api")&&wid&&notify&&wid===notify;
            console.log("CONTAINER_MODE_RAW="+mode);
            console.log("CONTAINER_MODE_EFF="+eff);
            console.log("CONTAINER_WID="+mask(process.env.GREEN_API_INSTANCE_WID));
            console.log("CONTAINER_NOTIFY="+mask(process.env.WHATSAPP_NOTIFY_TO));
            console.log("CONTAINER_ALT="+mask(process.env.WHATSAPP_NOTIFY_ALT_TO));
            console.log("CONTAINER_E164="+mask(process.env.EQUSTO_WHATSAPP_E164));
            console.log("CONTAINER_SELF_BLOCK="+(blocked?"YES":"no"));
            console.log("CONTAINER_GREEN="+(green?"ok":"MISSING"));
            ' || echo CONTAINER_DIAG=unreachable
