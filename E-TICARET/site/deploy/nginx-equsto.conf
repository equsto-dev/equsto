# Nginx alternatifi — Caddy yerine (Certbot ile TLS)
#   sudo ln -s /opt/equsto/E-TICARET/site/deploy/nginx-equsto.conf /etc/nginx/sites-enabled/equsto
#   sudo certbot --nginx -d equsto.com -d www.equsto.com

upstream equsto_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name equsto.com www.equsto.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://equsto.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.equsto.com;

    ssl_certificate     /etc/letsencrypt/live/equsto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/equsto.com/privkey.pem;

    return 301 https://equsto.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name equsto.com;

    ssl_certificate     /etc/letsencrypt/live/equsto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/equsto.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:EqustoSSL:10m;

    client_max_body_size 32m;

    location /api/pfos/ {
        proxy_pass http://equsto_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://equsto_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
