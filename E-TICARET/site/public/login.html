<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Üye Girişi · Equsto</title>
</head>
<body class="eq-auth">
  <div class="auth-topbar">
    <div class="theme-wrap">
      <button type="button" class="theme-toggle" id="theme-toggle" onclick="equstoCycleTheme()" title="Tema">◐</button>
      <span class="theme-legend" data-i18n="common.theme_label">Sistem · Açık · Koyu</span>
    </div>
  </div>

  <div class="auth-page">
    <div class="auth-card">
      <button type="button" class="auth-logo" onclick="eqGo('home')" aria-label="Equsto"></button>
      <h1 class="auth-title" id="auth-title" data-i18n="login.title">Üye girişi</h1>
      <p class="auth-sub" id="auth-sub" data-i18n="login.sub">E-posta ve şifrenizle giriş yapın veya Google ile devam edin.</p>

      <div id="auth-logged-panel" class="auth-logged-panel" style="display:none;">
        <p class="auth-logged-name" id="auth-logged-name"></p>
        <button type="button" class="auth-btn-primary" onclick="eqGo('account')" data-i18n="login.continue_account">Hesabıma git</button>
        <button type="button" class="auth-btn-ghost" id="auth-logout-btn" data-i18n="login.logout">Çıkış yap</button>
      </div>

      <div id="auth-forms-wrap">
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab auth-tab--active" id="auth-tab-login" data-mode="login" data-i18n="login.tab_login">Giriş</button>
          <button type="button" class="auth-tab" id="auth-tab-register" data-mode="register" data-i18n="login.tab_register">Kayıt ol</button>
        </div>

        <form id="auth-email-form" onsubmit="return equstoAuthEmailSubmit(event, window.__eqAuthMode || 'login')">
          <div class="auth-field auth-field--name" id="auth-name-wrap" style="display:none;">
            <label for="auth-name" data-i18n="login.name_label">Ad Soyad</label>
            <input id="auth-name" name="name" type="text" autocomplete="name" placeholder="Adınız Soyadınız" data-i18n-attr="placeholder:login.name_ph">
          </div>
          <div class="auth-field auth-field--phone" id="auth-phone-wrap" style="display:none;">
            <label for="auth-phone" data-i18n="login.phone_label">Cep telefonu</label>
            <input id="auth-phone" name="telefon" type="tel" autocomplete="tel" inputmode="tel" placeholder="5xx xxx xx xx" data-i18n-attr="placeholder:login.phone_ph">
          </div>
          <div class="auth-field">
            <label for="auth-email" data-i18n="login.email_label">E-posta</label>
            <input id="auth-email" name="email" type="email" autocomplete="username" placeholder="ornek@firma.com" data-i18n-attr="placeholder:login.email_ph" required>
          </div>
          <div class="auth-field">
            <label for="auth-password" data-i18n="login.password_label">Şifre</label>
            <input id="auth-password" name="password" type="password" autocomplete="current-password" placeholder="En az 8 karakter" data-i18n-attr="placeholder:login.password_ph" required minlength="8">
          </div>
          <p class="auth-forgot" id="auth-forgot-link-wrap">
            <button type="button" id="auth-show-forgot" data-i18n="login.forgot_link">Şifremi unuttum</button>
          </p>
          <div class="auth-field auth-field--password2" id="auth-password2-wrap" style="display:none;">
            <label for="auth-password2" data-i18n="login.password2_label">Şifre tekrar</label>
            <input id="auth-password2" name="password2" type="password" autocomplete="new-password" placeholder="Şifrenizi tekrar girin" data-i18n-attr="placeholder:login.password2_ph" minlength="8">
          </div>
          <button type="submit" class="auth-btn-primary" id="auth-submit-btn" data-i18n="login.submit_login">E-posta ile giriş yap</button>
        </form>

        <div class="auth-divider" data-i18n="login.divider_or">veya</div>

        <div id="google-btn-slot" aria-label="Google ile giriş" data-i18n-attr="aria-label:login.google_aria"></div>
        <button type="button" id="auth-google-fallback" class="auth-btn-social auth-btn-google" onclick="equstoGoogleSignIn()">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
          <span data-i18n="login.google_continue">Google ile devam et</span>
        </button>
      </div>

      <div id="auth-forgot-panel" class="auth-forgot-panel" style="display:none;">
        <div id="auth-forgot-step-request">
          <p class="auth-sub auth-forgot-lead">E-posta adresinize 6 haneli kurtarma kodu göndereceğiz.</p>
          <div class="auth-field">
            <label for="auth-forgot-email">E-posta</label>
            <input id="auth-forgot-email" type="email" autocomplete="username" placeholder="ornek@firma.com" required>
          </div>
          <button type="button" class="auth-btn-primary" id="auth-forgot-send-btn">Kurtarma kodu gönder</button>
        </div>
        <div id="auth-forgot-step-reset" style="display:none;">
          <p class="auth-sub auth-forgot-lead">E-postanıza gelen 6 haneli kodu ve yeni şifrenizi girin.</p>
          <div class="auth-field">
            <label for="auth-forgot-code">Kurtarma kodu</label>
            <input id="auth-forgot-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" maxlength="6" pattern="[0-9]{6}">
          </div>
          <div class="auth-field">
            <label for="auth-forgot-password">Yeni şifre</label>
            <input id="auth-forgot-password" type="password" autocomplete="new-password" placeholder="En az 8 karakter" minlength="8">
          </div>
          <div class="auth-field">
            <label for="auth-forgot-password2">Yeni şifre tekrar</label>
            <input id="auth-forgot-password2" type="password" autocomplete="new-password" placeholder="Şifrenizi tekrar girin" minlength="8">
          </div>
          <button type="button" class="auth-btn-primary" id="auth-forgot-save-btn">Şifreyi kaydet</button>
        </div>
        <p class="auth-forgot-back">
          <button type="button" id="auth-forgot-back">← Girişe dön</button>
        </p>
      </div>

      <div id="auth-social-msg" class="auth-msg" style="display:none;"></div>

      <div class="auth-back">
        <a onclick="eqGo('home')" data-i18n="login.back_home">← Ana sayfaya dön</a>
      </div>
    </div>
  </div>
</body>
</html>
