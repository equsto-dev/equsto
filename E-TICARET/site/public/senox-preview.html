<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Senox 2026 — PDF katalog önizleme</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --border: #2d3a4f;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 20, 25, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
    }
    h1 { margin: 0 0 4px; font-size: 1.35rem; font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.875rem; margin-bottom: 14px; }
    .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
    }
    .stat b { color: var(--accent); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    input, select {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.875rem;
    }
    input { flex: 1; min-width: 200px; max-width: 360px; }
    select { min-width: 180px; }
    main { padding: 20px 24px 48px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: var(--accent); }
    .thumb {
      aspect-ratio: 4/3;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .thumb img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .thumb.empty {
      background: #111827;
      color: var(--muted);
      font-size: 0.75rem;
    }
    .body { padding: 12px 14px 14px; flex: 1; }
    .model {
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .title {
      font-size: 0.85rem;
      line-height: 1.35;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta { font-size: 0.75rem; color: var(--muted); line-height: 1.5; }
    .meta span { display: block; }
    .badge {
      display: inline-block;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #243044;
      color: var(--muted);
      margin-top: 6px;
    }
    .badge.no-img { background: #422006; color: var(--warn); }
    .loading, .err {
      text-align: center;
      padding: 48px;
      color: var(--muted);
    }
    .err { color: #f87171; }
    footer {
      text-align: center;
      padding: 16px;
      color: var(--muted);
      font-size: 0.75rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <h1>Senox 2026-1 — PDF katalog</h1>
    <p class="sub">Yerel önizleme · görseller PDF bbox render (3×) · <code>npm run catalog:senox:full</code></p>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Model veya başlık ara…" autocomplete="off"/>
      <select id="cat"><option value="">Tüm kategoriler</option></select>
      <select id="grp"><option value="">Tüm gruplar</option></select>
      <select id="filter">
        <option value="">Tümü</option>
        <option value="img">Görseli olan</option>
        <option value="noimg">Görseli eksik</option>
        <option value="dims">Ölçüsü olan</option>
        <option value="price">Fiyatı olan</option>
      </select>
    </div>
  </header>
  <main>
    <div id="status" class="loading">Katalog yükleniyor…</div>
    <div class="grid" id="grid" hidden></div>
  </main>
  <footer>SENOX PDF → Equsto araştırma · canlı siteye aktarılmadı</footer>
  <script>
    const CATALOG = "/data/fiyat-listeleri/senox/2026-1/catalog.json";
    let all = [];

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }

    function renderStats(data, shown) {
      const el = document.getElementById("stats");
      el.innerHTML = [
        ["Ürün", data.productCount],
        ["Görsel", data.withImage],
        ["Ölçü", data.withDims],
        ["EUR fiyat", data.withPrice],
        ["Gösterilen", shown],
      ]
        .map(([k, v]) => `<div class="stat"><b>${v}</b> ${k}</div>`)
        .join("");
    }

    function fillCategories(products) {
      const sel = document.getElementById("cat");
      const gsel = document.getElementById("grp");
      const cats = [...new Set(products.map((p) => p.category).filter(Boolean))].sort();
      const grps = [...new Set(products.map((p) => p.categoryGroup).filter(Boolean))].sort();
      for (const c of cats) {
        const o = document.createElement("option");
        o.value = c;
        o.textContent = c;
        sel.appendChild(o);
      }
      for (const g of grps) {
        const o = document.createElement("option");
        o.value = g;
        o.textContent = g;
        gsel.appendChild(o);
      }
    }

    function match(p, q, cat, grp, filter) {
      if (cat && p.category !== cat) return false;
      if (grp && p.categoryGroup !== grp) return false;
      if (filter === "img" && !p.image) return false;
      if (filter === "noimg" && p.image) return false;
      if (filter === "dims" && !p.specs?.ebat_mm) return false;
      if (filter === "price" && !p.specs?.fiyat_eur) return false;
      if (!q) return true;
      const blob = (p.model + " " + p.title + " " + p.category).toLowerCase();
      return blob.includes(q);
    }

    function render() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const cat = document.getElementById("cat").value;
      const grp = document.getElementById("grp").value;
      const filter = document.getElementById("filter").value;
      const list = all.filter((p) => match(p, q, cat, grp, filter));
      const grid = document.getElementById("grid");
      grid.innerHTML = list
        .map((p) => {
          const sp = p.specs || {};
          const thumb = p.image
            ? `<img src="${esc(p.image)}" alt="" loading="lazy"/>`
            : `<span>Görsel yok</span>`;
          return `<article class="card">
            <div class="thumb${p.image ? "" : " empty"}">${thumb}</div>
            <div class="body">
              <div class="model">${esc(p.model)}</div>
              <div class="title">${esc(p.title)}</div>
              <div class="meta">
                <span>${esc(p.categoryGroup)} → ${esc(p.category)}</span>
                ${sp.ebat_mm ? `<span>Ölçü: ${esc(sp.ebat_mm)} mm</span>` : ""}
                ${sp.fiyat_eur ? `<span>Fiyat: ${esc(sp.fiyat_eur)} EUR</span>` : ""}
                ${sp.sogutucu_gaz ? `<span>Gaz: ${esc(sp.sogutucu_gaz)}</span>` : ""}
                ${sp.voltaj ? `<span>${esc(sp.voltaj)}</span>` : ""}
                <span>Sayfa ${p.page}</span>
              </div>
              <span class="badge${p.image ? "" : " no-img"}">${p.image ? "bbox render" : "görsel eksik"}</span>
            </div>
          </article>`;
        })
        .join("");
      grid.hidden = list.length === 0;
      document.getElementById("status").hidden = list.length > 0;
      document.getElementById("status").textContent =
        list.length === 0 ? "Eşleşen ürün yok." : "";
      renderStats(window.__catalogMeta || {}, list.length);
    }

    async function init() {
      try {
        const res = await fetch(CATALOG + "?v=" + Date.now());
        if (!res.ok) throw new Error("catalog.json bulunamadı — önce: node scripts/sync-senox-preview.mjs");
        const data = await res.json();
        window.__catalogMeta = data;
        all = data.products || [];
        fillCategories(all);
        document.getElementById("status").hidden = true;
        document.getElementById("grid").hidden = false;
        render();
        document.getElementById("q").addEventListener("input", render);
        document.getElementById("cat").addEventListener("change", render);
        document.getElementById("grp").addEventListener("change", render);
        document.getElementById("filter").addEventListener("change", render);
      } catch (e) {
        document.getElementById("status").className = "err";
        document.getElementById("status").textContent = e.message;
      }
    }
    init();
  </script>
</body>
</html>
