<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafemarkt şablon önizleme · Equsto</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/theme.css?v=20260530cm-preview-v1">

<body class="eq-shop eq-cm-preview-page">
<div class="pg"><div class="body"><div class="right-col">
<div class="eq-cm-preview" id="eq-cm-preview-root">
  <div class="eq-cm-preview__banner" role="status">
    <strong>Önizleme</strong>
    <span>Cafemarkt tarzı şablon (statik HTML). React sürüm: <a href="/cafemarkt-sablon">/cafemarkt-sablon</a></span>
    <a href="/">Mevcut ana sayfa →</a>
  </div>
  <section class="eq-cm-hero" aria-label="Vitrin hero">
    <div class="eq-cm-hero__grid">
      <div class="eq-cm-hero__main">
        <div class="eq-cm-hero__stage" id="eq-cm-hero-stage"></div>
        <div class="eq-cm-hero__dots" id="eq-cm-hero-dots" role="tablist"></div>
      </div>
      <div class="eq-cm-hero__side" id="eq-cm-hero-side"></div>
    </div>
  </section>
  <section class="eq-cm-cats" aria-labelledby="eq-cm-cats-title">
    <div class="eq-cm-cats__head">
      <h2 id="eq-cm-cats-title">Popüler Kategoriler</h2>
      <div class="eq-cm-cats__nav">
        <button type="button" id="eq-cm-cats-prev" aria-label="Önceki">‹</button>
        <button type="button" id="eq-cm-cats-next" aria-label="Sonraki">›</button>
      </div>
    </div>
    <div class="eq-cm-cats__track" id="eq-cm-cats-track"></div>
  </section>
  <section class="eq-cm-mosaic" id="eq-cm-mosaic" aria-label="Kampanya vitrinleri"></section>
