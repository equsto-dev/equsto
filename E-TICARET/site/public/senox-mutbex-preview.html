<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Senox — Mutbex katalog önizleme</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --border: #2d3a4f;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --accent: #10b981;
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 20, 25, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
    }
    h1 { margin: 0 0 4px; font-size: 1.35rem; font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.875rem; margin-bottom: 14px; }
    .sub a { color: var(--accent); }
    .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
    }
    .stat b { color: var(--accent); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    input, select {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.875rem;
    }
    input { flex: 1; min-width: 200px; max-width: 360px; }
    select { min-width: 180px; }
    main { padding: 20px 24px 48px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: var(--accent); }
    .thumb {
      aspect-ratio: 4/3;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .thumb img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .thumb.empty {
      background: #111827;
      color: var(--muted);
      font-size: 0.75rem;
    }
    .body { padding: 12px 14px 14px; flex: 1; }
    .model {
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 2px;
    }
    .code { font-size: 0.7rem; color: var(--muted); margin-bottom: 4px; }
    .title {
      font-size: 0.85rem;
      line-height: 1.35;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta { font-size: 0.75rem; color: var(--muted); line-height: 1.5; }
    .meta span { display: block; }
    .price { color: var(--text); font-weight: 600; }
    .badge {
      display: inline-block;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #243044;
      color: var(--muted);
      margin-top: 6px;
      margin-right: 4px;
    }
    .badge.stock { background: #14532d; color: var(--ok); }
    .badge.nostock { background: #422006; color: var(--warn); }
    .link {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--accent);
      text-decoration: none;
    }
    .link:hover { text-decoration: underline; }
    .desc {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .loading, .err {
      text-align: center;
      padding: 48px;
      color: var(--muted);
    }
    .err { color: #f87171; }
    footer {
      text-align: center;
      padding: 16px;
      color: var(--muted);
      font-size: 0.75rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <h1>Senox — Mutbex katalog</h1>
    <p class="sub">
      Yerel önizleme · kaynak <a href="https://www.mutbex.com/senox" target="_blank" rel="noopener">mutbex.com/senox</a>
      · <code>npm run catalog:senox:mutbex:preview</code>
      · <a href="/senox-preview.html">PDF katalog</a>
    </p>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Model, kod veya başlık ara…" autocomplete="off"/>
      <select id="cat"><option value="">Tüm kategoriler</option></select>
      <select id="grp"><option value="">Tüm gruplar</option></select>
      <select id="filter">
        <option value="">Tümü</option>
        <option value="img">Görseli olan</option>
        <option value="noimg">Görseli eksik</option>
        <option value="dims">Ölçüsü olan</option>
        <option value="price">Fiyatı olan</option>
        <option value="stock">Stokta</option>
      </select>
    </div>
  </header>
  <main>
    <div id="status" class="loading">Katalog yükleniyor…</div>
    <div class="grid" id="grid" hidden></div>
  </main>
  <footer>Mutbex → Equsto araştırma · canlı siteye aktarılmadı</footer>
  <script>
    const CATALOG = "/data/fiyat-listeleri/senox/mutbex/catalog.json";
    let all = [];

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }

    function fmtEur(n) {
      if (n == null) return "";
      return Number(n).toLocaleString("tr-TR", { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + " EUR";
    }

    function fmtTry(n) {
      if (n == null) return "";
      return Number(n).toLocaleString("tr-TR", { maximumFractionDigits: 0 }) + " TL";
    }

    function renderStats(data, shown) {
      const el = document.getElementById("stats");
      el.innerHTML = [
        ["Ürün", data.productCount],
        ["Görsel", data.withImage],
        ["Ölçü", data.withDims],
        ["EUR fiyat", data.withPrice],
        ["Açıklama", data.withDesc],
        ["Gösterilen", shown],
      ]
        .map(([k, v]) => `<div class="stat"><b>${v ?? "—"}</b> ${k}</div>`)
        .join("");
    }

    function fillCategories(products) {
      const sel = document.getElementById("cat");
      const gsel = document.getElementById("grp");
      const cats = [...new Set(products.map((p) => p.category).filter(Boolean))].sort();
      const grps = [...new Set(products.map((p) => p.categoryGroup).filter(Boolean))].sort();
      for (const c of cats) {
        const o = document.createElement("option");
        o.value = c;
        o.textContent = c;
        sel.appendChild(o);
      }
      for (const g of grps) {
        const o = document.createElement("option");
        o.value = g;
        o.textContent = g;
        gsel.appendChild(o);
      }
    }

    function match(p, q, cat, grp, filter) {
      if (cat && p.category !== cat) return false;
      if (grp && p.categoryGroup !== grp) return false;
      if (filter === "img" && !p.image) return false;
      if (filter === "noimg" && p.image) return false;
      if (filter === "dims" && !p.olculer) return false;
      if (filter === "price" && p.priceEur == null) return false;
      if (filter === "stock" && !(p.stockQty > 0)) return false;
      if (!q) return true;
      const blob = (p.model + " " + p.mutbexCode + " " + p.title + " " + p.category).toLowerCase();
      return blob.includes(q);
    }

    function render() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const cat = document.getElementById("cat").value;
      const grp = document.getElementById("grp").value;
      const filter = document.getElementById("filter").value;
      const list = all.filter((p) => match(p, q, cat, grp, filter));
      const grid = document.getElementById("grid");
      grid.innerHTML = list
        .map((p) => {
          const o = p.olculer;
          const thumb = p.image && !String(p.image).startsWith("http")
            ? `<img src="${esc(p.image)}" alt="" loading="lazy"/>`
            : p.image
              ? `<img src="${esc(p.image)}" alt="" loading="lazy"/>`
              : `<span>Görsel yok</span>`;
          const stockBadge =
            p.stockQty > 0
              ? `<span class="badge stock">Stok: ${p.stockQty}</span>`
              : `<span class="badge nostock">Stok yok</span>`;
          return `<article class="card">
            <div class="thumb${p.image ? "" : " empty"}">${thumb}</div>
            <div class="body">
              <div class="model">${esc(p.model)}</div>
              <div class="code">${esc(p.mutbexCode)}</div>
              <div class="title">${esc(p.title)}</div>
              <div class="meta">
                <span>${esc(p.categoryPath || p.category)}</span>
                ${o ? `<span>Ölçü: ${esc(o.raw || `${o.genislik_mm}×${o.derinlik_mm}${o.yukseklik_mm ? "×" + o.yukseklik_mm : ""} mm`)}</span>` : ""}
                ${p.priceEur != null ? `<span class="price">${esc(fmtEur(p.priceEur))}${p.priceTry != null ? " · " + esc(fmtTry(p.priceTry)) : ""}</span>` : ""}
              </div>
              ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ""}
              ${stockBadge}
              <span class="badge">mutbex</span>
              ${p.url ? `<a class="link" href="${esc(p.url)}" target="_blank" rel="noopener">mutbex.com →</a>` : ""}
            </div>
          </article>`;
        })
        .join("");
      grid.hidden = list.length === 0;
      document.getElementById("status").hidden = list.length > 0;
      document.getElementById("status").textContent =
        list.length === 0 ? "Eşleşen ürün yok." : "";
      renderStats(window.__catalogMeta || {}, list.length);
    }

    async function init() {
      try {
        const res = await fetch(CATALOG + "?v=" + Date.now());
        if (!res.ok) throw new Error("catalog.json bulunamadı — önce: npm run catalog:senox:mutbex:preview");
        const data = await res.json();
        window.__catalogMeta = data;
        all = data.products || [];
        fillCategories(all);
        document.getElementById("status").hidden = true;
        document.getElementById("grid").hidden = false;
        render();
        document.getElementById("q").addEventListener("input", render);
        document.getElementById("cat").addEventListener("change", render);
        document.getElementById("grp").addEventListener("change", render);
        document.getElementById("filter").addEventListener("change", render);
      } catch (e) {
        document.getElementById("status").className = "err";
        document.getElementById("status").textContent = e.message;
      }
    }
    init();
  </script>
</body>
</html>
