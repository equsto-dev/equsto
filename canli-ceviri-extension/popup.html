<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      margin: 0;
      width: 300px;
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
      background: #0e1520;
      color: #eef3f8;
    }
    main { padding: 14px; display: grid; gap: 10px; }
    h1 { margin: 0; font-size: 16px; }
    p { margin: 0; color: #8fa0b3; font-size: 12px; }
    label { display: grid; gap: 4px; color: #8fa0b3; font-size: 11px; }
    input, select {
      border: 1px solid #2a3648;
      background: #172233;
      color: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    .row { display: flex; gap: 8px; }
    button {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 11px;
      font-weight: 650;
      cursor: pointer;
    }
    #start { background: #3ddc97; color: #042216; }
    #stop { background: #2a3648; color: #fff; }
    button:disabled { opacity: 0.4; cursor: default; }
    #err { color: #ff8b8b; font-size: 12px; min-height: 1em; }
  </style>
</head>
<body>
  <main>
    <h1>Canlı Çeviri</h1>
    <p>Yayın sekmesinde Başlat. Video sesi açık kalır · kadın Türkçe ses.</p>
    <label>
      Groq API
      <input id="apiKey" type="password" placeholder="gsk_..." autocomplete="off" />
    </label>
    <label>
      Hassasiyet
      <select id="sensitivity">
        <option value="low">Düşük (az gürültü yakalar)</option>
        <option value="mid" selected>Normal</option>
        <option value="high">Yüksek (daha çok konuşma)</option>
      </select>
    </label>
    <div class="row">
      <button id="start">Başlat</button>
      <button id="stop" disabled>Durdur</button>
    </div>
    <div id="err"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
