<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      margin: 0;
      width: 280px;
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
      background: #101820;
      color: #f3f6f9;
    }
    main { padding: 14px; display: grid; gap: 10px; }
    h1 { margin: 0; font-size: 15px; }
    .hint { color: #9db0c2; font-size: 12px; }
    label { display: grid; gap: 4px; color: #9db0c2; font-size: 11px; }
    input {
      border: 1px solid #2c3b4c;
      background: #182230;
      color: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    .row { display: flex; gap: 8px; }
    button {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 10px;
      font-weight: 650;
      cursor: pointer;
    }
    #start { background: #3ddc97; color: #062216; }
    #stop { background: #2c3b4c; color: #fff; }
    button:disabled { opacity: 0.4; }
    #err { color: #ff8a8a; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Canlı Çeviri</h1>
    <div class="hint">Yayın sekmesine geç → Başlat. Ses açık kalır · kadın ses.</div>
    <label>
      Groq API anahtarı
      <input id="apiKey" type="password" placeholder="gsk_..." />
    </label>
    <div class="row">
      <button id="start">Başlat</button>
      <button id="stop" disabled>Durdur</button>
    </div>
    <div id="err"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
