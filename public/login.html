<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Üye Girişi · Equsto</title>
  <meta name="description" content="Equsto üye girişi — e-posta veya Google ile devam edin.">
  <meta name="robots" content="noindex, follow">
  <meta name="googlebot" content="noindex, follow">
  <link rel="canonical" href="https://equsto.com/login.html">
  <!-- CSS sunucuda yoksa sayfa ham HTML görünmesin (canlıda theme.css + auth.css gerekli) -->
  <style id="auth-critical-inline">
    :root{--eq-bg-page:#f0f2f7;--eq-surface:#fff;--eq-surface-2:#f6f7fb;--eq-text:#1a1d2b;--eq-text-muted:#5c6378;--eq-text-secondary:#3d4458;--eq-border:#dde1ea;--eq-border-soft:#e8ebf2;--eq-font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    html[data-theme="dark"]{--eq-bg-page:#0f1118;--eq-surface:#1a1d28;--eq-surface-2:#222633;--eq-text:#e8eaef;--eq-text-muted:#9aa3b5;--eq-border:#2e3448}
    body{margin:0;font-family:var(--eq-font-sans);background:var(--eq-bg-page);color:var(--eq-text)}
    .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px 48px}
    .auth-card{width:100%;max-width:400px;background:var(--eq-surface);border:1px solid var(--eq-border);border-radius:12px;padding:28px 24px;box-shadow:0 8px 32px rgba(0,0,0,.06)}
    .auth-title{font-size:20px;font-weight:600;text-align:center;margin:0 0 4px}
    .auth-sub{font-size:12px;color:var(--eq-text-muted);text-align:center;margin:0 0 22px}
    .auth-field{margin-bottom:12px}
    .auth-field label{display:block;font-size:11px;font-weight:500;margin-bottom:4px;color:var(--eq-text-secondary)}
    .auth-field input{width:100%;box-sizing:border-box;padding:10px 12px;font-size:13px;border:1px solid var(--eq-border);border-radius:8px;background:var(--eq-surface);color:var(--eq-text)}
    .auth-btn-primary,.auth-btn-social,.auth-btn-ghost{width:100%;box-sizing:border-box;padding:11px 16px;font-size:13px;border-radius:8px;cursor:pointer;margin-bottom:10px}
    .auth-btn-primary{font-weight:600;border:none;background:var(--eq-text);color:var(--eq-surface)}
    .auth-btn-social{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--eq-border);background:var(--eq-surface);color:var(--eq-text)}
    .auth-tabs{display:flex;margin-bottom:16px;border:1px solid var(--eq-border);border-radius:8px;overflow:hidden}
    .auth-tab{flex:1;padding:9px 12px;font-size:12px;font-weight:600;border:none;background:var(--eq-surface-2);color:var(--eq-text-muted);cursor:pointer}
    .auth-tab--active{background:var(--eq-text);color:var(--eq-surface)}
    .auth-topbar{position:fixed;top:0;right:0;padding:12px 16px;z-index:10}
    .auth-back{margin-top:20px;text-align:center}
    .auth-back a{font-size:12px;color:var(--eq-text-muted);text-decoration:none}
  </style>
  <link rel="stylesheet" href="/theme.css?v=20260520logohdr">
  <link rel="stylesheet" href="/auth.css?v=20260520logohdr">
  <script src="/theme.js?v=20260520logohdr"></script>
  <script src="/equsto-member.js?v=20260522wa"></script>
  <script src="/eq-auth-api.js"></script>
  <script src="/equsto-auth-client.js?v=20260520logohdr"></script>
  <script src="/equsto-logo.js?v=20260519wordmark3"></script>
  <script src="/eq-i18n.js?v=20260520logohdr"></script>
  <script src="/eq-site-urls.js?v=20260520logohdr"></script>
  <script>
    window.EQUSTO_AUTH = window.EQUSTO_AUTH || {};
  </script>
  <script src="/auth-social.js?v=20260520logohdr" defer></script>
</head>
<body>
  <div class="auth-topbar">
    <div class="theme-wrap">
      <button type="button" class="theme-toggle" id="theme-toggle" onclick="equstoCycleTheme()" title="Tema">◐</button>
      <span class="theme-legend">Sistem · Açık · Koyu</span>
    </div>
  </div>

  <div class="auth-page">
    <div class="auth-card">
      <button type="button" class="auth-logo" onclick="eqGo('home')" aria-label="Equsto"></button>
      <h1 class="auth-title" id="auth-title">Üye girişi</h1>
      <p class="auth-sub" id="auth-sub">E-posta ve şifrenizle giriş yapın veya Google ile devam edin.</p>

      <div id="auth-logged-panel" class="auth-logged-panel" style="display:none;">
        <p class="auth-logged-name" id="auth-logged-name"></p>
        <button type="button" class="auth-btn-primary" onclick="eqGo('home')">Alışverişe devam et</button>
        <button type="button" class="auth-btn-ghost" id="auth-logout-btn">Çıkış yap</button>
      </div>

      <div id="auth-forms-wrap">
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab auth-tab--active" id="auth-tab-login" data-mode="login">Giriş</button>
          <button type="button" class="auth-tab" id="auth-tab-register" data-mode="register">Kayıt ol</button>
        </div>

        <form id="auth-email-form" onsubmit="return equstoAuthEmailSubmit(event, window.__eqAuthMode || 'login')">
          <div class="auth-field auth-field--name" id="auth-name-wrap" style="display:none;">
            <label for="auth-name">Ad Soyad</label>
            <input id="auth-name" name="name" type="text" autocomplete="name" placeholder="Adınız Soyadınız">
          </div>
          <div class="auth-field">
            <label for="auth-email">E-posta</label>
            <input id="auth-email" name="email" type="email" autocomplete="username" placeholder="ornek@firma.com" required>
          </div>
          <div class="auth-field">
            <label for="auth-password">Şifre</label>
            <input id="auth-password" name="password" type="password" autocomplete="current-password" placeholder="En az 8 karakter" required minlength="8">
          </div>
          <button type="submit" class="auth-btn-primary" id="auth-submit-btn">E-posta ile giriş yap</button>
        </form>

        <div class="auth-divider">veya</div>

        <div id="google-btn-slot" aria-label="Google ile giriş"></div>
        <button type="button" id="auth-google-fallback" class="auth-btn-social auth-btn-google" onclick="equstoGoogleSignIn()">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
          Google ile devam et
        </button>

      </div>

      <div id="auth-social-msg" class="auth-msg" style="display:none;"></div>

      <div class="auth-back">
        <a onclick="eqGo('home')">← Ana sayfaya dön</a>
      </div>
    </div>
  </div>

  <script>
    window.__eqAuthMode = 'login';

    function setAuthMode(mode) {
      window.__eqAuthMode = mode;
      var isReg = mode === 'register';
      document.getElementById('auth-tab-login').classList.toggle('auth-tab--active', !isReg);
      document.getElementById('auth-tab-register').classList.toggle('auth-tab--active', isReg);
      document.getElementById('auth-name-wrap').style.display = isReg ? 'block' : 'none';
      document.getElementById('auth-submit-btn').textContent = isReg
        ? 'Hesap oluştur'
        : 'E-posta ile giriş yap';
      document.getElementById('auth-title').textContent = isReg ? 'Üye kaydı' : 'Üye girişi';
      document.getElementById('auth-sub').textContent = isReg
        ? 'E-posta ile ücretsiz hesap oluşturun. Şifre en az 8 karakter olmalıdır.'
        : 'E-posta ve şifrenizle giriş yapın veya Google ile devam edin.';
      document.getElementById('auth-password').autocomplete = isReg ? 'new-password' : 'current-password';
    }

    document.getElementById('auth-tab-login').addEventListener('click', function () {
      setAuthMode('login');
    });
    document.getElementById('auth-tab-register').addEventListener('click', function () {
      setAuthMode('register');
    });

    function showLoggedIn() {
      if (!window.equstoIsMemberLoggedIn || !window.equstoIsMemberLoggedIn()) return;
      var m = window.equstoGetMember && window.equstoGetMember();
      document.getElementById('auth-forms-wrap').style.display = 'none';
      document.querySelector('.auth-divider') &&
        (document.querySelector('.auth-divider').style.display = 'none');
      var panel = document.getElementById('auth-logged-panel');
      panel.style.display = 'block';
      document.getElementById('auth-logged-name').textContent =
        'Hoş geldiniz, ' + (m && (m.displayName || m.name || m.email) || 'üye');
    }

    document.getElementById('auth-logout-btn').addEventListener('click', function () {
      var p =
        typeof window.equstoAuthLogout === 'function'
          ? window.equstoAuthLogout()
          : Promise.resolve();
      p.then(function () {
        try {
          localStorage.removeItem('equsto_member_v1');
          localStorage.removeItem('equsto-ecom-cart-v1');
        } catch (_) {}
        if (typeof window.equstoUrl === 'function') {
          location.href = window.equstoUrl('shop');
        } else {
          location.href = '/';
        }
      });
    });

    window.addEventListener('DOMContentLoaded', function () {
      var boot = function () {
        if (typeof equstoInitSocialAuth === 'function') equstoInitSocialAuth();
        showLoggedIn();
      };
      var ready = window.__eqAuthApiReady || Promise.resolve();
      ready.then(function () {
        if (typeof equstoAuthBootstrap === 'function') {
          return equstoAuthBootstrap().then(function (j) {
            var el = document.getElementById('auth-social-msg');
            if (j && j.success) {
              if (el) {
                el.innerHTML = '';
                el.style.display = 'none';
              }
            } else if (j && j._httpStatus === 404 && el) {
              el.innerHTML =
                'Üye girişi API’si bulunamadı. cPanel Node uygulaması (<code>equsto-api</code>) çalışıyor olmalı.';
              el.className = 'auth-msg auth-msg--info';
              el.style.display = 'block';
            }
            boot();
          });
        }
        boot();
      });
    });
  </script>
